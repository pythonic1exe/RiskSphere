$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      if (data?.tokens?.accessToken) pm.environment.set('accessToken', data.tokens.accessToken);
      if (data?.tokens?.refreshToken) pm.environment.set('refreshToken', data.tokens.refreshToken);
    language: text/javascript
order: 2000
